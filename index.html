<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppDisco</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--bd:#e6e8eb;--ink:#1a1d21;--sub:#8a9099;--teal:#0aa3a3;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px 60px;}
header{margin-bottom:14px;}
h1{font-size:22px;margin:0 0 4px;}
.meta{color:var(--sub);font-size:13px;margin-bottom:14px;}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.upd{color:var(--sub);font-size:12px;}
.runbtn{margin-left:auto;font-size:13px;padding:7px 14px;border-radius:10px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;white-space:nowrap;}
.runbtn:hover{background:#088;}
.controls{position:sticky;top:0;background:var(--bg);padding:10px 0 12px;z-index:5;
border-bottom:1px solid var(--bd);margin-bottom:16px;
display:flex;gap:24px;align-items:center;justify-content:space-between;}
.tabsblock{flex:1;min-width:0;}
.tabsblock .tabrow:last-child{margin-bottom:0;}
.tabrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
.tablabel{font-size:11px;color:var(--sub);letter-spacing:.06em;width:74px;flex:0 0 74px;}
.tab{font-size:13px;padding:6px 14px;border:1px solid var(--bd);border-radius:20px;
background:#fff;cursor:pointer;color:#3a3f45;}
.tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.search{flex:0 0 300px;padding:10px 14px;border:1px solid var(--bd);
border-radius:10px;font-size:14px;}
.day{display:flex;gap:16px;background:var(--card);border:1px solid var(--bd);
border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.rail{flex:0 0 140px;padding-right:12px;border-right:1px solid var(--bd);}
.wd{color:var(--sub);font-size:11px;letter-spacing:.08em;font-weight:600;}
.dt{font-size:19px;font-weight:700;margin:2px 0 8px;line-height:1.15;}
.tot{font-size:13px;color:#3a3f45;}
.new{font-size:12px;color:var(--teal);font-weight:600;margin-top:2px;}
.grid{flex:1;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;}
.card{width:104px;}
.card.tracked{width:116px;padding:6px;background:#e7f0ff;border:2px solid #2f6bff;border-radius:16px;box-shadow:0 2px 8px rgba(47,107,255,.25);}
.card.tracked .ic,.card.tracked .ic img{width:100px;height:100px;}
.card.tracked .nm{color:#0b3aa3;}
.ic{display:block;position:relative;width:104px;height:104px;}
.ic img{width:104px;height:104px;border-radius:22px;border:1px solid var(--bd);
object-fit:cover;background:#eee;}
.flag{position:absolute;left:5px;bottom:5px;font-size:15px;line-height:1;
background:rgba(255,255,255,.9);border-radius:5px;padding:1px 3px;}
.nm{font-size:12px;font-weight:700;color:#14161a;margin:6px 0 2px;line-height:1.25;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pub{display:block;font-size:11px;color:var(--teal);text-decoration:none;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pub:hover{text-decoration:underline;}
.tag{display:inline-block;font-size:9px;color:#2f6bff;border:1px solid #bcd0ff;background:#eef3ff;
border-radius:4px;padding:0 3px;margin-top:2px;}
.empty{color:var(--sub);font-size:14px;padding:30px 4px;}
@media(max-width:760px){.controls{flex-direction:column;align-items:stretch;}.search{flex:1 1 auto;}}
@media(max-width:640px){.day{flex-direction:column;}.rail{flex:none;border-right:none;
border-bottom:1px solid var(--bd);padding:0 0 10px;}.tablabel{width:100%;flex:0 0 100%;}}
</style></head><body><div class="wrap">
<header>
<div class="topbar"><h1>🔎 AppDisco</h1>
<div class="upd">Son guncelleme: 02.09.2026 13:05 (Istanbul)</div>
<a class="runbtn" href="https://github.com/caner777/store-monitor/actions/workflows/discover.yml" target="_blank" rel="noopener" title="GitHub Actions acilir; yesil Run workflow butonuna bas">🔄 Guncelle</a></div>
<div class="controls">
<div class="tabsblock">
<div class="tabrow"><span class="tablabel">PLATFORM</span><button class="tab active" data-val="all">Tumu</button></div>
<div class="tabrow"><span class="tablabel">TUR</span><button class="tab active" data-val="all">Tumu</button><button class="tab" data-val="puzzle">Puzzle</button><button class="tab" data-val="action">Action</button><button class="tab" data-val="board">Board</button><button class="tab" data-val="casual">Casual</button><button class="tab" data-val="card">Card</button></div>
</div>
<input class="search" id="q" type="search" placeholder="Oyun veya yayinci ara...">
</div></header>
<div id="list">

</div>
<div class="empty" id="empty" style="display:none">Sonuc yok.</div>
</div>
<script>
(function(){
  var fPlat=new Set(), fCat=new Set(), q="";
  function apply(){
    var days=document.querySelectorAll('.day'), shown=0, anyDay=0;
    days.forEach(function(day){
      var vis=0,nw=0;
      day.querySelectorAll('.card').forEach(function(c){
        var okP = fPlat.size===0 || fPlat.has(c.dataset.plat);
        var okC = fCat.size===0 || (c.dataset.cats||"").split(" ").some(function(x){return fCat.has(x);});
        var okQ = !q || c.dataset.nm.indexOf(q)>=0 || c.dataset.pub.indexOf(q)>=0;
        var show = okP && okC && okQ;
        c.style.display = show?"":"none";
        if(show){vis++; shown++; if(c.classList.contains("new"))nw++;}
      });
      day.style.display = vis?"":"none";
      if(vis)anyDay++;
      var t=day.querySelector('.tot'), n=day.querySelector('.new');
      if(t)t.textContent=vis+" oyun";
      if(n)n.textContent=nw+" yeni";
    });
    var _s=document.getElementById('shown'); if(_s)_s.textContent=shown;
    document.getElementById('empty').style.display=anyDay?"none":"";
  }
  function wire(row, which){
    row.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click',function(){
        var v=btn.dataset.val;
        var set = which==="plat"?fPlat:fCat;
        if(v==="all"){set.clear();}
        else{if(set.has(v))set.delete(v);else set.add(v);}
        row.querySelectorAll('.tab').forEach(function(b){
          var bv=b.dataset.val;
          b.classList.toggle('active', bv==="all"?set.size===0:set.has(bv));
        });
        apply();
      });
    });
  }
  var rows=document.querySelectorAll('.tabrow');
  if(rows[0])wire(rows[0],"plat");
  if(rows[1])wire(rows[1],"cat");
  var qi=document.getElementById('q');
  qi.addEventListener('input',function(){q=qi.value.toLowerCase().trim();apply();});
})();
</script>
</body></html>
